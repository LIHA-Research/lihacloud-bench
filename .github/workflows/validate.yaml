name: Validate

on:
  pull_request:
  push:
    branches:
      - develop
      - staging
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.5
          cache: false

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build native CLI
        run: go build ./cmd/lihacloud-bench

  cross-build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.5
          cache: false

      - name: Cross-build CLI
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./cmd/lihacloud-bench

  clickcannon-build:
    name: Build ClickCannon (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.5
          cache: false

      - name: Fetch pinned ClickCannon source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ClickHouse/ClickCannon.git "${RUNNER_TEMP}/clickcannon"
          git -C "${RUNNER_TEMP}/clickcannon" checkout --detach 14dd50226fe5bed12f2d2720e1837a6b31951d13
          git -C "${RUNNER_TEMP}/clickcannon" apply "${GITHUB_WORKSPACE}/tools/clickcannon/patches/0001-portable-process-cpu-time.patch"

      - name: Cross-build patched helper
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o "${RUNNER_TEMP}/clickcannon-helper" .
        working-directory: ${{ runner.temp }}/clickcannon

  network-integration:
    name: Network integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.5
          cache: false

      - name: Build CLI
        run: go build -trimpath -o "${RUNNER_TEMP}/lihacloud-bench" ./cmd/lihacloud-bench

      - name: Run iperf3 loopback profile
        shell: bash
        env:
          IPERF_IMAGE: networkstatic/iperf3@sha256:25bce1d02f5e1c0acb4a4376815b87059ad730cd9a1c18ce8a9cb9babd7ad05f
          TEST_NETWORK: lihacloud-bench-${{ github.run_id }}-${{ github.run_attempt }}
          TEST_SERVER: lihacloud-bench-iperf-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker network create "${TEST_NETWORK}"
          docker run -d --name "${TEST_SERVER}" --network "${TEST_NETWORK}" "${IPERF_IMAGE}" -s
          sleep 1
          docker run --rm --network "${TEST_NETWORK}" \
            -v "${RUNNER_TEMP}:/it" \
            --entrypoint /it/lihacloud-bench \
            -e "LIHACLOUD_BENCH_IPERF_TARGET=${TEST_SERVER}" \
            "${IPERF_IMAGE}" network iperf --profile quick --output /it/results --yes

      - name: Clean up iperf3 loopback
        if: always()
        shell: bash
        env:
          TEST_NETWORK: lihacloud-bench-${{ github.run_id }}-${{ github.run_attempt }}
          TEST_SERVER: lihacloud-bench-iperf-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker rm -f "${TEST_SERVER}" 2>/dev/null || true
          docker network rm "${TEST_NETWORK}" 2>/dev/null || true
